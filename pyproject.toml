[project]
name = "eve-diagnostics"
version = "0.1.0"
description = "Diagnostic test bookings with simulated payments (EVE Healthcare take-home)"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # FastAPI's Depends()/Query() in defaults is idiomatic

[tool.ruff.lint.isort]
# The local alembic/ migrations directory would otherwise make ruff treat the package as ours.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]
